name: MatchPointTennis
options:
  bundleIdPrefix: com.matchpoint
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: Y6VZTXTFW8
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: 9.0.0
targets:
  MatchPointTennis:
    type: application
    platform: iOS
    sources:
      - MatchPointTennis
    resources:
      - MatchPointTennis/Resources
      - path: ../assets/brand/matchpoint-tennis-logo-light.png
      - path: ../assets/generated/bg-login-live.png
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.matchpoint.clubs
        MARKETING_VERSION: 1.2.3
        CURRENT_PROJECT_VERSION: 11
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MatchPointTennis/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: MatchPointTennis/Resources/MatchPointTennis.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseCore
      - package: GoogleSignIn
        product: GoogleSignIn

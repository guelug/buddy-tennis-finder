name: PersonalShooper
options:
  bundleIdPrefix: com.personalshooper
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    DEVELOPMENT_TEAM: ""

configs:
  Debug:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  Release:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  PersonalShooper:
    type: application
    platform: iOS
    sources:
      - path: PersonalShooper
        excludes:
          - "**/*.md"
          - "**/*.xcloc"
    settings:
      base:
        INFOPLIST_FILE: PersonalShooper/Info.plist
        CODE_SIGN_ENTITLEMENTS: PersonalShooper/PersonalShooper.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.personalshooper.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: true
    entitlements:
      path: PersonalShooper/PersonalShooper.entitlements
    dependencies:
      - package: SnapKit
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: Vision.framework
      - sdk: CoreML.framework
      - sdk: StoreKit.framework
      - sdk: AVFoundation.framework
      - sdk: Photos.framework

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: "5.7.1"

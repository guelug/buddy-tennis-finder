name: PersonalShooper
options:
  bundleIdPrefix: com.personalshooper
  deploymentTarget:
    iOS: "18.4"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "72"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    DEVELOPMENT_TEAM: "Y6VZTXTFW8"
    SWIFT_STRICT_CONCURRENCY: "complete"

configs:
  Debug:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG"
  Release:
    settings:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: "wholemodule"

targets:
  PersonalShooper:
    type: application
    platform: iOS
    sources:
      - path: PersonalShooper
        excludes:
          - "**/*.md"
          - "**/*.xcloc"
          - "**/*.bak"
          - "**/*.example.plist"
          - "LocalSecrets.plist"
    settings:
      base:
        INFOPLIST_FILE: PersonalShooper/Info.plist
        CODE_SIGN_ENTITLEMENTS: PersonalShooper/PersonalShooper.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.personalshooper.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: true
        ENABLE_PREVIEWS: YES
        OTHER_LDFLAGS[sdk=iphoneos*]: -weak_framework VisualIntelligence
    entitlements:
      path: PersonalShooper/PersonalShooper.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.personalshooper.shared
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - sdk: FoundationModels.framework
        weak: true
      - sdk: HealthKit.framework
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: Vision.framework
      - sdk: CoreML.framework
      - sdk: NaturalLanguage.framework
      - sdk: StoreKit.framework
      - sdk: AVFoundation.framework
      - sdk: Photos.framework
      - sdk: Speech.framework
      - sdk: ImageIO.framework
      - sdk: EventKit.framework
      - sdk: CoreLocation.framework
      - sdk: AppIntents.framework
      - sdk: WidgetKit.framework
      - sdk: ImagePlayground.framework
        weak: true
      - target: PersonalShooperWidgets

  PersonalShooperTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PersonalShooperTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalshooper.app.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: PersonalShooper

  PersonalShooperUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PersonalShooperUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personalshooper.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PersonalShooper
    dependencies:
      - target: PersonalShooper

  PersonalShooperWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: PersonalShooperWidgets
      - path: PersonalShooper/Shared/StyleCompanionSharedModels.swift
    settings:
      base:
        INFOPLIST_FILE: PersonalShooperWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: PersonalShooperWidgets/PersonalShooperWidgets.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.personalshooper.app.widgets
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        APPLICATION_EXTENSION_API_ONLY: YES
        SWIFT_EMIT_LOC_STRINGS: true
    entitlements:
      path: PersonalShooperWidgets/PersonalShooperWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.personalshooper.shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: AppIntents.framework

packages:
  SnapKit:
    url: https://github.com/SnapKit/SnapKit.git
    from: "5.7.1"

schemes:
  PersonalShooper:
    build:
      targets:
        PersonalShooper: all
    run:
      config: Debug
      environmentVariables:
        GEMINI_API_KEY: ""
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - PersonalShooperTests
        - PersonalShooperUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  PersonalShooperTests:
    build:
      targets:
        PersonalShooperTests: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PersonalShooperTests
  PersonalShooperUITests:
    build:
      targets:
        PersonalShooperUITests: all
    test:
      config: Debug
      targets:
        - PersonalShooperUITests
